<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d4491a">
<meta name="description" content="%1RM 프로그램 자동 계산 운동 기록장">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>짐로그</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f0e8; --card:#fbf9f4; --fg:#1d1c1a; --mute:#6f6a60; --line:#dcd6c8;
  --acc:#d4491a; --accT:#a8360d; --acc-fg:#fff; --ok:#2f7d4f; --ok-bg:#e1efe5; --warn:#8a5400;
  --inp:#fff; --shadow:0 1px 0 rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413; --card:#1e1d1b; --fg:#ece8df; --mute:#9a9486; --line:#34322d;
  --acc:#ff6a3a; --accT:#ff7a4d; --acc-fg:#1a0d06; --ok:#6fcf93; --ok-bg:#1f3327; --warn:#e0a63a;
  --inp:#262523; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141413; --card:#1e1d1b; --fg:#ece8df; --mute:#9a9486; --line:#34322d;
  --acc:#ff6a3a; --accT:#ff7a4d; --acc-fg:#1a0d06; --ok:#6fcf93; --ok-bg:#1f3327; --warn:#e0a63a;
  --inp:#262523; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 "Noto Sans KR",system-ui,sans-serif;
  padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto}
.num,h1,h2,.tabs button{font-family:"Barlow Condensed","Noto Sans KR",sans-serif}
header{padding-top:14px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.02em}
#sync{font-size:12px;color:var(--mute)}
#sync.err{color:var(--acc)}
.tabs{display:flex;gap:4px;margin:10px 0 14px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:10px 0 8px;font-size:18px;font-weight:600;letter-spacing:.04em}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.mute{color:var(--mute);font-size:13px}
.tag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accT);font-weight:700}
h2{margin:2px 0 6px;font-size:21px;font-weight:600;line-height:1.15}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:9px 8px;width:100%;font-size:16px;min-width:0;min-height:46px}
select.auto{font-style:italic;opacity:.75}
input[type=checkbox]{min-height:0}
details>summary{min-height:44px;display:flex;align-items:center;cursor:pointer}
textarea{resize:vertical;min-height:64px}
input[type=number]{text-align:center}
.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-weight:500;min-height:44px}
.btn.pri{background:var(--acc);color:var(--acc-fg);border-color:var(--acc);font-weight:700}
.sethead,.set{display:grid;grid-template-columns:40px 1fr 1fr 62px 44px;gap:6px;align-items:center}
.sethead{font-size:11px;color:var(--mute);text-align:center;margin-bottom:2px}
.set{margin-top:6px}
.set .n{text-align:center;font-weight:700;color:var(--mute)}
.set .ok{height:46px;border-radius:8px;border:1px solid var(--line);background:var(--inp);font-size:18px;font-weight:700;color:var(--mute)}
.set.done .ok{background:var(--ok);border-color:var(--ok);color:#fff}
.set.done input,.set.done select{background:var(--ok-bg);border-color:transparent}
.tgt{grid-column:2/-1;font-size:12px;color:var(--mute);margin-top:-2px;line-height:1.3}
.plates{color:var(--warn)}
.chk{display:flex;gap:10px;align-items:center;padding:6px 0}
.chk input{width:22px;height:22px;accent-color:var(--ok);flex:none}
.exh{display:flex;gap:8px;align-items:flex-start}
.ib{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--inp);font-size:20px;line-height:1;color:var(--mute)}
.ib.on{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.card.ss{border-left:4px solid var(--acc)}
.panel{margin-top:10px;padding:10px;border:1px dashed var(--line);border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--inp);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;min-height:40px}
.anarow{display:grid;grid-template-columns:44px 1fr 56px 64px;gap:6px;font-size:13px;padding:3px 0;border-top:1px solid var(--line)}
.xk{height:46px;border-radius:8px;border:1px solid var(--line);background:var(--inp);font-size:13px;font-weight:700;color:var(--mute)}
.set.failed .xk{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.mbar{height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.mbar>i{display:block;height:8px;border-radius:4px;background:var(--acc)}
.mrow{display:grid;grid-template-columns:86px 1fr 52px;gap:8px;align-items:center;padding:4px 0;font-size:14px}
.hrow{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.hrow .hist{margin:0;flex:1}
.stype{height:46px;border-radius:8px;border:1px solid var(--line);background:var(--inp);font-weight:700;color:var(--mute)}
.stype.warm{color:var(--warn)}.stype.drop{color:var(--accT)}.stype.fail{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 8px);z-index:30;max-width:92vw;background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 10px 8px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#toast[hidden]{display:none}
#toast button{background:transparent;border:1px solid currentColor;border-radius:8px;color:inherit;padding:6px 10px;min-height:36px;flex:none}
.ch{margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:32px;padding:3px 11px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:13px}
.chips button[aria-pressed=true]{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.chinfo{font-size:13px;margin:6px 0 2px;min-height:18px}
.chw{touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.chw:active{cursor:grabbing}
.chw svg{display:block;width:100%}
.stats{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
.stats b{font-size:24px;font-family:"Barlow Condensed",sans-serif}
.pickday{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
#restbar{position:fixed;left:0;right:0;bottom:0;background:var(--fg);color:var(--bg);display:none;align-items:center;gap:10px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
#restbar.on{display:flex}
#restbar b{font-size:30px;font-family:"Barlow Condensed",sans-serif;flex:1}
#restbar button{background:transparent;border:1px solid currentColor;border-radius:8px;color:inherit;padding:7px 10px}
.hist{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:block;font-size:12px;color:var(--mute)}
pre{white-space:pre-wrap;word-break:break-word;background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;margin:8px 0 0}
svg{max-width:100%}
[hidden]{display:none!important}
</style>

<div class="wrap">
  <header><h1>짐로그</h1><span id="sync">연결 중…</span></header>
  <nav class="tabs" role="tablist">
    <button data-tab="today" aria-selected="true">오늘</button>
    <button data-tab="hist" aria-selected="false">기록</button>
    <button data-tab="body" aria-selected="false">몸</button>
    <button data-tab="prof" aria-selected="false">프로필</button>
    <button data-tab="set" aria-selected="false">설정</button>
  </nav>
  <main id="view"></main>
</div>
<div id="toast" hidden></div>
<div id="restbar"><span class="mute" style="color:inherit;opacity:.7">휴식</span><b id="restt">0:00</b>
  <button data-rest="30">+30초</button><button data-rest="stop">끝</button></div>

let impData=null;
async function readImport(file){

  }catch(e){impData=null;msg.textContent='불러오기 실패: '+(e.message||e)}

function applyImport(){
  const d=impData;if(!d)return;
  try{
    const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('gl:'))ks.push(k)}
    ks.forEach(k=>localStorage.removeItem(k));
    Object.entries(d.logs||{}).forEach(([k,v])=>localStorage.setItem('gl:log:'+k,JSON.stringify(v)));
    Object.entries(d.body||{}).forEach(([k,v])=>localStorage.setItem('gl:body:'+k,JSON.stringify(v)));
    (d.programs||[]).forEach(p=>{if(p&&p.id)localStorage.setItem('gl:prog:'+p.id,JSON.stringify(p))});

}

function spark(ds){return sparkV(ds.map(d=>+BODY[d].weight))}
function sparkV(v){

/* ---------- 인터랙티브 차트 (기간 버튼 · 밀어서 이동 · 두 손가락/Ctrl+휠 확대 · 탭해서 값 보기) ---------- */
const CH={};let CHN=0;
const CHR=[30,90,182,365];
const chFmt=v=>Math.abs(v)>=1000?Math.round(v).toLocaleString('ko-KR'):nf(Math.round(v*10)/10);
function chFull(c){const a=c.ts[0],b=c.ts[c.ts.length-1],pad=Math.max(2*864e5,(b-a)*.03);return[a-pad,b+pad]}

  const f=chFull(c),full=f[1]-f[0],min=Math.min(7*864e5,full);

function chSetMode(c,m){
  c.mode=m;const f=chFull(c);
  if(m==='all'){c.v0=f[0];c.v1=f[1]}else{c.v1=f[1];c.v0=f[1]-(+m)*864e5}
  chClamp(c);
}
const chVis=c=>{const o=[];c.ts.forEach((t,i)=>{if(t>=c.v0&&t<=c.v1)o.push(i)});return o};
function chChips(c){
  const full=c.ts[c.ts.length-1]-c.ts[0],o=[];
  CHR.forEach(d=>{if(d*864e5<full*1.3)o.push(`<button data-chr="${d}" aria-pressed="${c.mode===String(d)}">${d===30?'1개월':d===90?'3개월':d===182?'6개월':'1년'}</button>`)});
  o.push(`<button data-chr="all" aria-pressed="${c.mode==='all'}">전체</button>`);
  return o.join('');
}
function chInfo(c){
  const o=c.o,u=o.unit||'';
  if(c.sel!=null&&c.pts[c.sel]){const q=c.pts[c.sel];return`<b>${q.d}</b> · ${chFmt(q.y)}${u}${q.x?' · '+esc(q.x):''}`}
  const vi=chVis(c);if(!vi.length)return'이 기간에는 기록이 없습니다 (좌우로 밀어 이동)';
  const ys=vi.map(i=>c.pts[i].y),mx=Math.max(...ys),mn=Math.min(...ys),f=ys[0],l=ys[ys.length-1];
  if(o.type==='bar')return`${vi.length}회 · 평균 ${chFmt(ys.reduce((a,b)=>a+b,0)/ys.length)}${u} · 최대 ${chFmt(mx)}${u}`;
  const d=l-f;
  return`${vi.length}개 · 최고 ${chFmt(mx)}${u} · 최저 ${chFmt(mn)}${u} · 기간 변화 ${(d>=0?'+':'')+chFmt(d)}${u}`;
}
function chSvg(c){
  const o=c.o,bar=o.type==='bar',W=300,H=o.h||110,L=6,R=38,T=8,B=18,pw=W-L-R,ph=H-T-B,v0=c.v0,v1=c.v1,ts=c.ts,pts=c.pts,n=pts.length;
  const vi=chVis(c);
  const ys=vi.map(i=>pts[i].y);if(o.ref!=null&&!bar)ys.push(o.ref);
  let mn=ys.length?Math.min(...ys):0,mx=ys.length?Math.max(...ys):1;
  if(bar){mn=0;mx=(mx*1.08)||1}else{const pad=(mx-mn)*.15||Math.max(1,Math.abs(mx)*.02);mn-=pad;mx+=pad}
  const X=t=>L+(t-v0)/(v1-v0)*pw,Y=y=>T+(1-(y-mn)/(mx-mn))*ph,cid='cp'+c.n;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'추이')}"><defs><clipPath id="${cid}"><rect x="${L}" y="0" width="${pw}" height="${H}"/></clipPath></defs>`;
  [0,.5,1].forEach(f=>{const y=T+f*ph,v=mx-(mx-mn)*f;g+=`<line x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--line)" stroke-width=".6"/><text x="${W-R+3}" y="${(y+3).toFixed(1)}" font-size="8.5" style="fill:var(--mute)">${chFmt(v)}</text>`});
  if(o.ref!=null&&!bar&&o.ref>=mn&&o.ref<=mx)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(o.ref).toFixed(1)}" y2="${Y(o.ref).toFixed(1)}" style="stroke:var(--mute)" stroke-dasharray="3 3" stroke-width="1"/><text x="${W-R+3}" y="${(Y(o.ref)+3).toFixed(1)}" font-size="9" style="fill:var(--accT)">${esc(o.refLabel||'')}</text>`;
  g+=`<g clip-path="url(#${cid})">`;
  if(bar){
    const bw=Math.max(1.5,Math.min(14,pw/Math.max(vi.length,1)*.6));
    vi.forEach(i=>{const x=X(ts[i]),h=Math.max(1,(pts[i].y-mn)/(mx-mn)*ph);g+=`<rect x="${(x-bw/2).toFixed(1)}" y="${(T+ph-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" style="fill:var(--acc);opacity:${i===c.sel?1:.55}"/>`});
  }else if(vi.length){
    const a=Math.max(vi[0]-1,0),b=Math.min(vi[vi.length-1]+1,n-1),seg=[];
    for(let i=a;i<=b;i++)seg.push(X(ts[i]).toFixed(1)+','+Y(pts[i].y).toFixed(1));
    g+=`<polyline points="${seg.join(' ')}" fill="none" style="stroke:var(--acc)" stroke-width="1.8" stroke-linejoin="round"/>`;
    if(vi.length<=60)vi.forEach(i=>{g+=`<circle cx="${X(ts[i]).toFixed(1)}" cy="${Y(pts[i].y).toFixed(1)}" r="${i===c.sel?4:2.4}" style="fill:var(--acc)"/>`});
  }
  if(c.sel!=null&&pts[c.sel]){const x=X(ts[c.sel]);g+=`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${T}" y2="${T+ph}" style="stroke:var(--fg)" stroke-dasharray="2 2" stroke-width=".8"/>`;if(!bar)g+=`<circle cx="${x.toFixed(1)}" cy="${Y(pts[c.sel].y).toFixed(1)}" r="4" style="fill:var(--acc);stroke:var(--bg)" stroke-width="1.5"/>`}
  g+='</g>';
  const span=(v1-v0)/864e5,lab=t=>{const d=new Date(t),y=String(d.getUTCFullYear()).slice(2),m=pad(d.getUTCMonth()+1),dd=pad(d.getUTCDate());return span>200?y+'.'+m:span>45?m+'-'+dd:m+'-'+dd};
  [[0,'start'],[.5,'middle'],[1,'end']].forEach(([f,an])=>{g+=`<text x="${(L+f*pw).toFixed(1)}" y="${H-4}" font-size="8.5" text-anchor="${an}" style="fill:var(--mute)">${lab(v0+f*(v1-v0))}</text>`});

}
function chart(id,pts,o){

function chDraw(c){
  const el=[...document.querySelectorAll('.ch')].find(x=>CH[x.dataset.ch]===c);if(!el)return;
  el.querySelector('.chips').innerHTML=chChips(c);el.querySelector('.chinfo').innerHTML=chInfo(c);el.querySelector('.chw').innerHTML=chSvg(c);

let chRaf=0;const chDrawSoon=c=>{if(chRaf)return;chRaf=requestAnimationFrame(()=>{chRaf=0;chDraw(c)})};
const chOf=w=>{const el=w.closest('.ch');return el?CH[el.dataset.ch]:null};
const cptr=new Map();let cgs=null;
function chStart(w,c){

  cgs={w,c,r,v0:c.v0,v1:c.v1,moved:false};
  if(ps.length===1){cgs.k='pan';cgs.x0=ps[0].x}
  else if(ps.length>=2){const a=ps[0],b=ps[1];cgs.k='pin';cgs.d0=Math.hypot(a.x-b.x,a.y-b.y)||1;cgs.mx=(a.x+b.x)/2;cgs.moved=true}

  let b=vi[0];vi.forEach(i=>{if(Math.abs(c.ts[i]-t)<Math.abs(c.ts[b]-t))b=i});
  const now=Date.now();
  if(c.lt&&now-c.lt<350&&Math.abs(x-c.lx)<24){c.lt=0;chSetMode(c,'all');c.sel=null;chDraw(c);return}
  c.lt=now;c.lx=x;
  c.sel=c.sel===b?null:b;chDraw(c);

document.addEventListener('pointerdown',e=>{
  const w=e.target.closest&&e.target.closest('.chw');if(!w)return;const c=chOf(w);if(!c)return;

    if(cgs.moved){const dt=-dx/pxp*(cgs.v1-cgs.v0);c.v0=cgs.v0+dt;c.v1=cgs.v1+dt;c.mode='custom';chClamp(c);chDrawSoon(c)}
  }else if(cgs.k==='pin'){

    const d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y)||1,fx=Math.min(1,Math.max(0,((cgs.mx-r.left)/r.width*300-6)/256));

function chEnd(e){

function csvRows(t){

function parseXlsx(buf,fname){
  const wb=XLSX.read(buf,{type:'array',cellFormula:true,sheetStubs:true}),warn=[];
  const cv=(ws,r,c)=>ws[XLSX.utils.encode_cell({r:r-1,c:c-1})]||null;
  const tx=(ws,r,c)=>{const x=cv(ws,r,c);return x&&x.t!=='z'&&x.v!=null&&x.v!==''?x.v:null};
  const o=wb.Sheets['1RM입력'],rowLift={},orm={};
  if(o)for(let r=4;r<=14;r++){const lb=String(tx(o,r,1)||''),v=tx(o,r,4);
    const k=/클로즈|보조/.test(lb)?null:/벤치/.test(lb)?'bench':/스쿼트/.test(lb)?'squat':/데드/.test(lb)?'dead':/밀리터리|OHP|오버헤드/i.test(lb)?'ohp':null;
    if(k&&typeof v==='number'){rowLift[r]=k;orm[k]=v}}
  const weeks={};let sets=0;
  Object.keys(wb.Sheets).forEach(sn=>{
    const m=sn.match(/^(\d+)\s*주차$/);if(!m)return;
    const ws=wb.Sheets[sn],ref=XLSX.utils.decode_range(ws['!ref']||'A1:A1'),maxR=ref.e.r+1,maxC=ref.e.c+1,cols=[];
    for(let c=1;c<=maxC;c++){const v=tx(ws,3,c);if(typeof v==='string'&&/^Day\s*\d+/i.test(v.trim()))cols.push(c)}
    if(!cols.length){warn.push(sn+': Day 열을 찾지 못해 건너뜀');return}
    const W={t:String(tx(ws,1,2)||sn),tip:'',d:[]};
    cols.forEach(c0=>{
      const D={n:String(tx(ws,4,c0)||''),b:[]};let blk=null;
      for(let r=6;r<=maxR;r++){
        const a=tx(ws,r,c0);if(typeof a!=='string')continue;
        if(a.startsWith('💡')){if(!W.tip)W.tip=a;continue}
        if(a.startsWith('▶')){blk={t:a.slice(1).trim(),r:[]};D.b.push(blk);continue}
        if(!blk||/^추가 운동 없음/.test(a))continue;
        const wc=cv(ws,r,c0+1),f=wc&&wc.f,fm=f&&/\$D\$(\d+)\*([\d.]+)/.exec(f),note=tx(ws,r,c0+4),rep=tx(ws,r,c0+3);
        if(fm&&rowLift[+fm[1]]&&typeof rep==='number'){blk.r.push({l:a,k:rowLift[+fm[1]],p:parseFloat(fm[2]),n:rep,m:note});sets++}
        else{if(fm)warn.push(sn+' '+a+': 1RM 수식을 해석하지 못해 텍스트로 가져옴');blk.r.push({l:a,s:rep==null?'':String(rep),m:note})}
      }
      D.b=D.b.filter(x=>x.r.length);if(D.b.length)W.d.push(D);
    });
    if(W.d.length)weeks[+m[1]]=W;
  });
  if(!Object.keys(weeks).length)throw new Error("읽을 수 있는 양식이 아닙니다. 위 '샘플 양식 받기'로 받은 양식대로 정리해서 올려 주세요 (AI에 변환을 맡겨도 됩니다).");
  if(!sets)throw new Error("%1RM 수식으로 된 세트를 찾지 못했습니다. 위 '샘플 양식 받기'로 받은 양식대로 정리해서 올려 주세요.");
  const out={id:'p'+Date.now().toString(36),name:fname.replace(/\.(xlsx|xlsm)$/i,''),weeks,orm,warn,sets};cleanProg(out);return out;
}

function aiDigest(wk){

  if(rec.length)L.push('최신 1RM 기록: '+rec.join(' / '));
  const ws=weightSeries().filter(x=>x.d>=from);
  if(ws.length)L.push('체중: '+nf(ws[0].y)+'kg('+ws[0].d+')'+(ws.length>1?' → '+nf(ws[ws.length-1].y)+'kg('+ws[ws.length-1].d+')':''));
  const ib=ibSeries().filter(x=>x.fatPct||x.muscle).pop();
  if(ib)L.push('인바디('+ib.date+'): '+[ib.weight?'체중 '+nf(ib.weight)+'kg':'',ib.muscle?'골격근량 '+nf(ib.muscle)+'kg':'',ib.fatPct?'체지방률 '+nf(ib.fatPct)+'%':''].filter(Boolean).join(', '));
  L.push('','# 주별 (월요일 시작 · 운동일 · 세트 · 볼륨)');
  for(let m=monday(ds[0]);m<=today;m=addDays(m,7)){const a=weekAgg(m);L.push(m+' · '+a.days+'일 · '+a.sets+'세트 · '+nf(a.vol)+'kg')}

  ds.forEach(d=>(all[d].exercises||[]).forEach(e=>{

    const ss=(e.sets||[]).filter(q=>q.done&&q.type!=='warm'&&+q.r>0);if(!ss.length)return;
    const o=ex[n]||(ex[n]={n,sets:0,ses:[],best:null});o.sets+=ss.length;
    const g=[];ss.forEach(q=>{const k=(+q.w?nf(+q.w):'맨몸')+'×'+nf(+q.r),l=g[g.length-1];if(l&&l.k===k)l.c++;else g.push({k,c:1})});
    const rir=ss.map(q=>q.rir).filter(v=>v!==''&&v!=null);
    o.ses.push(md(d)+': '+g.map(x=>x.k+(x.c>1?'×'+x.c:'')).join(', ')+(rir.length?' (RIR '+rir.join('/')+')':'')+(ss.some(q=>q.type==='fail')?' 실패세트':''));
    ss.forEach(q=>{if(+q.w){const v=e1(q.w,q.r,q.rir);if(!o.best||v>o.best.e)o.best={e:v,d}}});
  }));
  const top=Object.values(ex).sort((a,b)=>b.sets-a.sets),main=top.slice(0,12),rest=top.slice(12);
  L.push('','# 종목별 (무게kg×반복×세트수, 웜업 제외)');
  main.forEach(o=>{L.push('- '+o.n+' · '+o.ses.length+'회 · '+o.sets+'세트'+(o.best?' · 최고 e1RM '+nf(Math.round(o.best.e*10)/10)+'kg('+md(o.best.d)+')':''));o.ses.slice(-12).forEach(x=>L.push('  '+x))});
  if(rest.length)L.push('- 그 밖: '+rest.map(o=>o.n+' '+o.sets+'세트').join(', '));
  const notes=[];
  ds.forEach(d=>{const l=all[d];if(l.note&&String(l.note).trim())notes.push(md(d)+' '+String(l.note).trim().replace(/\s+/g,' ').slice(0,80));

  if(/^(컨벤셔널)?(바벨)?데드(리프트)?$/.test(x))return'dead';

      const nm=(it.name||'').trim();
      if(!nm){errs.push('Day '+(di+1)+': 이름이 빈 운동이 있습니다');return}
      if(it.k==='main'){
        let n=0;
        for(let w=0;w<pb.nw;w++){const r=pbParse((it.w||[])[w]);if(r.bad.length)errs.push(nm+' '+(w+1)+'주차: ‘'+r.bad.join(' ')+'’을 읽지 못했습니다 (예: 65x5 70x5)');n+=r.out.length}
        if(!n)errs.push(nm+': 주차별 세트(%×횟수)를 입력하세요');
      }else if(!/^\d+\s*[x×*]\s*\S+/i.test(String(it.s||'').trim()))errs.push(nm+': 세트×횟수를 ‘3 × 8~12’ 형식으로 입력하세요');
    });
  });
  if(errs.length){pbErr=errs.slice(0,6).map(esc).join('<br>');render();return}
  const sp=clone(pb);delete sp.edit;sp.name=sp.name.trim();
  sp.days.forEach(D=>{D.n=(D.n||'').trim();D.items.forEach(it=>{it.name=it.name.trim();if(it.k!=='main')it.s=String(it.s).trim().replace(/\s*[x×*]\s*/i,' × ')})});
  const weeks=pbCompile(sp),doc={id:sp.id,name:sp.name,custom:true,spec:sp,weeks,importedAt:Date.now()};
  PROGS[sp.id]=cleanProg(clone(doc));
  S.starts=S.starts||{};if(!S.starts[sp.id]){S.starts[sp.id]=todayStr();saveSettings()}
  if(db){try{await db.doc('programs/'+sp.id).set(clone(doc))}catch(e){setSync('err',e)}}else lsSet('gl:prog:'+sp.id,doc);
  const ws=wkeys(PROGS[sp.id]);
  xlMsg='저장됨: ‘'+esc(sp.name)+'’ '+ws.length+'주 · 주 '+sp.days.length+'일. Day 1은 시작일부터 하루씩 이어집니다 (시작일은 아래에서 바꿀 수 있습니다).<div class="row" style="margin-top:8px"><button class="btn pri" data-a="useprog" data-id="'+sp.id+'">이 프로그램 사용</button></div>';
  pb=null;pbErr='';
  if(S.progId===sp.id&&cur&&!cur.free&&stats(cur).done===0){picked=null;cur=draft(date)}
  render();window.scrollTo(0,0);
}

  else if(a==='addwarm'){const e2=cur.exercises[i];wsteps((e2.sets[0]||{}).tw).slice().reverse().forEach(([w,r])=>e2.sets.unshift({type:'warm',tw:w,tr:r,w:w,r:r,rir:'',done:false}));scheduleSave();render()}
  else if(a==='finish'){
    if(cur.finishedAt){delete cur.finishedAt}else{if(stats(cur).done===0){toast('✓한 세트가 없어서 마칠 수 없습니다');return}cur.finishedAt=Date.now();stopRest()}
    scheduleSave();flushNow();render();
  }
  else if(a==='cfload'){cur=clone(LOGS[date]);dirty=false;clearTimeout(saveT);saveT=null;conflict=null;render()}

  else if(t.dataset.mi!==undefined&&t.value){const n=(ui.unk||[])[+t.dataset.mi];if(n){S.mmap=S.mmap||{};S.mmap[norm(n)]=t.value==='집계 제외'?[]:[[t.value,1]];saveSettings();render()}}
  else if(t.dataset.fs&&t.tagName==='SELECT'){fsSel(t.dataset.fs,t.value)}
  else if(t.dataset.pbs){
    if(t.dataset.pbs==='nw'){pb.nw=+t.value;render()}
    else if(t.dataset.pbs==='lift'){pb.days[+t.dataset.di].items[+t.dataset.ii].lift=t.value;render()}
  }
  else if(t.dataset.pg){S.progId=t.dataset.pg;saveSettings();picked=null;cur=draft(date);render()}
  else if(t.id==='ibf'&&t.files&&t.files[0]){ibImport(t.files[0])}
  else if(t.id==='xl'&&t.files&&t.files[0]){importXlsx(t.files[0])}
  else if(t.id==='impf'&&t.files&&t.files[0]){readImport(t.files[0])}
  else if(t.id==='bdate'&&t.value){bodyDate=t.value;render()}
  else if(t.id==='start'&&t.value){S.starts=S.starts||{};S.starts[S.progId]=t.value;if(S.progId==='v3')S.start=t.value;saveSettings()}
  else if(t.id==='aiw'){aiW=+t.value;render()}
  else if(t.id==='goal3'){S.goal3=+t.value||0;saveSettings()}
  else if(t.id==='bar'){S.bar=+t.value||20;saveSettings()}
});
function conflictHtml(){return`<div class="card" style="border-color:var(--acc)"><b>다른 탭에서 이 날 기록을 수정했습니다</b><div class="mute" style="margin:4px 0 8px">지금 화면의 편집 내용과 서버 내용이 다릅니다.</div><div class="row"><button class="btn pri" data-a="cfload">서버 내용 불러오기</button><button class="btn" data-a="cfkeep">내 편집 유지</button></div></div>`}
function toast(msg,undo){
  const el=$('#toast');el.innerHTML='<span></span>'+(undo?'<button data-a="undo">되돌리기</button>':'');el.firstChild.textContent=msg;
  toastUndo=undo||null;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;toastUndo=null},5000);
}
function detectPR(e,s){
  if(e.check||e.attempt)return null;
  const w=+s.w,r=+s.r;if(!w||!r)return null;
  const H=hist(e.name).filter(h=>h.date!==cur.date);if(!H.length)return null;
  const prevE=Math.max(...H.map(h=>h.top.e)),prevW=Math.max(...H.flatMap(h=>h.sets.map(q=>q.w)));
  const others=e.sets.filter(q=>q!==s&&q.done&&q.type!=='warm'&&+q.w&&+q.r);
  const bestE=Math.max(prevE,...others.map(q=>e1(q.w,q.r,q.rir))),bestW=Math.max(prevW,...others.map(q=>+q.w));
  if(w>bestW+1e-9)return{label:'무게 PR'};
  if(e1(w,r,s.rir)>bestE+.05)return{label:'e1RM PR'};
  return null;
}
function dayMuscles(doc){
  const tot={};MUS.forEach(m=>tot[m]=0);
  (doc.exercises||[]).forEach(e=>{if(e.check||e.tag==='워밍업')return;const n=(e.sets||[]).filter(q=>q.done&&q.rir!=='4+'&&q.type!=='warm').length;if(!n)return;const mm=muscleOf(e.name);if(mm)mm.forEach(([m,wt])=>{tot[m]+=n*wt})});
  return tot;
}
function finishHtml(){
  const st=stats(cur),prs=[];
  cur.exercises.forEach(e=>(e.sets||[]).forEach(q=>{if(q.pr)prs.push(cleanName(e.name)+' '+nf(q.w)+'×'+nf(q.r)+' ('+q.pr+')')}));
  const pd=addDays(cur.date,-7),pl=LOGS[pd],dm=Object.entries(dayMuscles(cur)).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return`<div class="card" style="border-color:var(--ok)"><span class="tag">운동 완료</span><div class="stats">${statsHtml(st)}</div>
  ${pl&&pl.volume?`<div class="mute">지난주 같은 요일(${pd.slice(5)}) 볼륨 ${nf(pl.volume)}kg 대비 ${dlt(st.vol,pl.volume,'kg')} (${Math.round((st.vol/pl.volume-1)*100)}%)</div>`:''}
  ${st.done<st.total?`<div class="mute">못 한 세트 ${st.total-st.done}개</div>`:''}
  ${prs.length?`<div style="margin-top:6px"><b>🏆 PR ${prs.length}개</b><div class="mute">${prs.map(esc).join(' · ')}</div></div>`:''}
  <div class="mute" style="margin-top:6px">자극 부위(세트): ${dm.map(x=>x[0]+' '+nf(x[1])).join(' · ')||'-'}</div>${fsHtml()}</div>`;
}
function weekAgg(mon){
  const all=Object.assign({},LOGS);if(cur)all[cur.date]=cur;
  let days=0,vol=0,sets=0,pr=0;
  for(let k=0;k<7;k++){const l=all[addDays(mon,k)];if(!l||!l.exercises)continue;const st=stats(l);if(st.done>0){days++;vol+=st.vol;sets+=st.done;l.exercises.forEach(e=>(e.sets||[]).forEach(q=>{if(q.pr)pr++}))}}
  return{days,vol,sets,pr};
}
function weekReportCard(){
  const mon=monday(todayStr()),a=weekAgg(mon),b=weekAgg(addDays(mon,-7)),ws=weekSets(mon).tot;
  const low=MUS.filter(m=>ws[m]<10&&!['전완','복근','승모근'].includes(m)).map(m=>m+' '+nf(ws[m]));
  return`<div class="card"><span class="tag">이번 주 요약 (${mon.slice(5)}~)</span>
  <div class="stats"><span><b>${a.days}</b> <span class="mute">일 운동 (지난주 ${b.days})</span></span><span><b>${nf(a.vol)}</b> <span class="mute">kg 볼륨${b.vol?` (지난주 대비 ${Math.round((a.vol/b.vol-1)*100)}%)`:''}</span></span><span><b>${a.pr}</b> <span class="mute">PR</span></span></div>
  <div class="mute" style="margin-top:6px">10세트 미달 부위: ${low.join(' · ')||'없음'}</div></div>`;
}
function prCard(){
  const all=Object.assign({},LOGS);if(cur)all[cur.date]=cur;const rows=[];
  Object.keys(all).sort().reverse().forEach(d=>(all[d].exercises||[]).forEach(e=>(e.sets||[]).forEach(q=>{if(q.pr&&rows.length<10)rows.push({d,n:cleanName(e.name),w:q.w,r:q.r,pr:q.pr,e:e1(q.w,q.r,q.rir)})})));
  if(!rows.length)return'';
  return`<div class="card"><span class="tag">최근 PR</span>${rows.map(x=>`<div class="anarow" style="grid-template-columns:44px 1fr 70px 70px"><span>${x.d.slice(5)}</span><span style="min-width:0">${esc(x.n)}</span><b>${nf(x.w)}×${nf(x.r)}</b><span class="mute">${esc(x.pr)}</span></div>`).join('')}</div>`;
}
function fixSS(){const c={};cur.exercises.forEach(e=>{if(e.ss)c[e.ss]=(c[e.ss]||0)+1});cur.exercises.forEach(e=>{if(e.ss&&c[e.ss]<2)delete e.ss})}
function ssNext(i,j){const e=cur.exercises[i];if(!e.ss)return null;for(let k=i+1;k<cur.exercises.length;k++){const x=cur.exercises[k];if(x.ss===e.ss&&x.sets[j]&&!x.sets[j].done)return x}return null}
function flash(msg){$('#restbar').classList.add('on');$('#restt').textContent=msg;clearInterval(restTick);rest=null;setTimeout(()=>{if(!rest)$('#restbar').classList.remove('on')},3500)}
async function importXlsx(file){
  const msg=$('#xlmsg');msg.textContent='읽는 중…';
  try{
    let prog=null;
    if(/\.csv$/i.test(file.name)){
      const buf=await file.arrayBuffer();let t=new TextDecoder('utf-8').decode(buf);
      if(t.includes('\ufffd')){try{t=new TextDecoder('euc-kr').decode(buf)}catch(e){}}
      prog=parseTemplate(csvRows(t.replace(/^\ufeff/,'')),file.name);
      if(!prog)throw new Error('머리글(주차·Day·운동)을 찾지 못했습니다. 샘플 양식의 첫 줄 머리글을 그대로 써 주세요.');
    }else{
      await loadXlsx();const buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:'array'});
      for(const sn of wb.SheetNames){prog=parseTemplate(XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''}),file.name);if(prog)break}
      if(!prog)prog=parseXlsx(buf,file.name);
    }
    await storeImported(prog);
  }catch(e){xlMsg='가져오기 실패: '+esc(e.message||e);render()}
}
async function storeImported(prog){
    const ws=wkeys(prog);
    const doc={id:prog.id,name:prog.name,weeks:prog.weeks,orm:prog.orm,importedAt:Date.now()};
    if(prog.spec){doc.custom=true;doc.spec=prog.spec}
    PROGS[prog.id]=doc;
    if(db){await db.doc('programs/'+prog.id).set(clone(doc))}else lsSet('gl:prog:'+prog.id,doc);
    const o=Object.keys(prog.orm).length?` · 엑셀의 1RM: ${Object.keys(prog.orm).map(k=>LN[k]+' '+prog.orm[k]).join(', ')}`:'';
    xlMsg=`가져옴: ‘${esc(prog.name)}’ ${ws.length}주 · 주 ${doc.weeks[ws[0]].d.length}일 · %1RM 세트 ${prog.sets}개${prog.acc!=null?' · 보조 운동 '+prog.acc+'줄':''}${o}${prog.warn.length?'<br>주의: '+prog.warn.slice(0,8).map(esc).join(' / ')+(prog.warn.length>8?' 외 '+(prog.warn.length-8)+'건':''):''}
      <div class="row" style="margin-top:8px"><button class="btn pri" data-a="useprog" data-id="${prog.id}">이 프로그램 사용</button>${prog.orm&&Object.keys(prog.orm).length?`<button class="btn" data-a="applyorm" data-id="${prog.id}">엑셀 1RM을 설정에 적용</button>`:''}</div>`;
    render();
}
function upStats(){const el=$('#stats');if(el){stamp();el.innerHTML=statsHtml(stats(cur));const w_=$('#mnwarn');if(w_)w_.textContent=!cur.minutesManual&&autoMinutes(cur)>90?'자동 계산이 '+autoMinutes(cur)+'분으로 길게 나왔습니다. 실제 시간을 입력해 주세요.':''}}

/* ---------- rest timer ---------- */
function startRest(sec){rest={end:Date.now()+sec*1000};$('#restbar').classList.add('on');clearInterval(restTick);restTick=setInterval(tick,250);tick()}
function stopRest(){rest=null;clearInterval(restTick);$('#restbar').classList.remove('on')}
function tick(){
  if(!rest)return;const left=Math.ceil((rest.end-Date.now())/1000);
  if(left<=0){beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}$('#restt').textContent='0:00 · 다음 세트';rest=null;clearInterval(restTick);setTimeout(()=>{if(!rest)$('#restbar').classList.remove('on')},6000);return}
  $('#restt').textContent=Math.floor(left/60)+':'+pad(left%60);
}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.35)}catch(e){}}
let wl=null;
function keepAwake(){try{if(navigator.wakeLock&&!wl)navigator.wakeLock.request('screen').then(l=>{wl=l;l.addEventListener('release',()=>{wl=null})}).catch(()=>{})}catch(e){}}
document.addEventListener('click',keepAwake,{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});

/* ---------- boot ---------- */
function adopt(){
  if(tab==='today'&&cur&&LOGS[cur.date]&&!dirty&&!hasFocus&&LOGS[cur.date].updatedAt!==cur.updatedAt){cur=clone(LOGS[cur.date]);render()}
  else if(tab==='hist'||tab==='body')render();
}
async function boot(){
  S=Object.assign(clone(DEF),lsGet('gl:settings',{}));PROFILE=lsGet('gl:profile',PROFILE);
  cur=draft(date);render();setSync('wait');
  let c=null;
  db=c;
  if(!db){
    try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('gl:log:')){const v=JSON.parse(localStorage.getItem(k));if(v)LOGS[k.slice(7)]=v}if(k.startsWith('gl:body:')){const v=JSON.parse(localStorage.getItem(k));if(v)BODY[k.slice(8)]=v}}}catch(e){}
    try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('gl:prog:')){const v=JSON.parse(localStorage.getItem(k));if(v)PROGS[v.id]=cleanProg(v)}}}catch(e){}
    setSync('local');cur=draft(date);render();return;
  }
  const t=setTimeout(()=>setSync('wait'),10000);
  const err=e=>setSync('err',e);
  db.doc('settings/main').onSnapshot(s=>{if(s.exists){const d=s.data();S=Object.assign(clone(DEF),d,{orm:Object.assign({},DEF.orm,d.orm||{}),starts:Object.assign({},d.starts||{}),mmap:Object.assign({},d.mmap||{})});lsSet('gl:settings',S);if(!dirty&&!hasFocus){if(!LOGS[date])cur=draft(date);render()}}},err);
  db.collection('logs').orderBy('date','desc').limit(1000).onSnapshot(q=>{clearTimeout(t);LOGS={};q.docs.forEach(d=>LOGS[d.id]=d.data());if(!q.metadata.fromCache){setSync('ok');recoverLogs()}
    Object.keys(LOGS).forEach(d=>{const u=LOGS[d]&&LOGS[d].updatedAt,st_=seen[d]||(seen[d]=new Set());if(st_.has(u))return;st_.add(u);if(firstLogSnap)return;if(cur&&cur.date===d&&u!==cur.updatedAt&&(dirty||hasFocus))conflict=d});
    firstLogSnap=false;
    if(conflict&&cur&&conflict===cur.date&&tab==='today'&&!document.querySelector('[data-a=cfload]'))$('#view').insertAdjacentHTML('afterbegin',conflictHtml());if(!LOGS[date]&&!dirty&&!hasFocus&&tab==='today'){cur=draft(date);render()}else adopt()},err);
  db.doc('profile/main').onSnapshot(x=>{if(x.exists){PROFILE=Object.assign({records:[],inbody:[]},x.data());lsSet('gl:profile',PROFILE);if(tab==='prof'&&!hasFocus)render()}},err);
  db.collection('programs').limit(50).onSnapshot(q=>{PROGS={v3:BUILTIN};q.docs.forEach(d=>{const x=d.data();PROGS[d.id]=cleanProg(Object.assign({},x,{id:d.id}))});if(!LOGS[date]&&!dirty&&!hasFocus&&tab==='today')cur=draft(date);if((tab==='set'||tab==='today')&&!hasFocus)render()},err);
  db.collection('body').orderBy('date','desc').limit(1000).onSnapshot(q=>{const keep={};pend.forEach(d=>{if(BODY[d])keep[d]=BODY[d]});BODY={};q.docs.forEach(d=>BODY[d.id]=d.data());Object.assign(BODY,keep);if(!q.metadata.fromCache)recoverBody();if(tab==='body'&&!hasFocus)render()},err);
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();aiBoot();
